# Deploy Next.js (Dockerfile) → Cloud Run "hookstep" (jr-consulting-co, us-central1).
# Secrets: GCP_SA_JSON (deploy SA — ./scripts/provision-github-actions-deploy-sa.sh).
# Optional: DOTENV_PRODUCTION_B64 (base64 .env.production; no PORT/HOST in prod file — sync script strips them too).
# Private clone: CLOUD_RUN_APP_CHECKOUT_TOKEN + vars CLOUD_RUN_APP_REPOSITORY / CLOUD_RUN_APP_PATH if needed.

name: Cloud Run — hookstep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloud-run-hookstep-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: jr-consulting-co
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER || '696545445518' }}
  REGION: us-central1
  SERVICE: hookstep
  AR_REPOSITORY: cloud-run-source-deploy
  CLOUD_RUN_APP_PATH: ${{ vars.CLOUD_RUN_APP_PATH }}

jobs:
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect Next.js app in this repository
        id: detect
        run: |
          set -euo pipefail
          has() { [ -f "$1/package.json" ] && [ -f "$1/package-lock.json" ]; }
          if has "."; then
            echo "app_root=." >> "$GITHUB_OUTPUT"
          elif has "frontend"; then
            echo "app_root=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "app_root=" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone Next app (when workflow repo is not the app)
        if: ${{ steps.detect.outputs.app_root == '' }}
        env:
          NEXT_REPO_SLUG: ${{ vars.CLOUD_RUN_APP_REPOSITORY || 'jatinder14/hiring-platform' }}
          CLONE_TOKEN: ${{ secrets.CLOUD_RUN_APP_CHECKOUT_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          rm -rf _cloud_run_app
          echo "Cloning https://github.com/${NEXT_REPO_SLUG}.git (depth 1) into _cloud_run_app"
          if [ -n "${CLONE_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${CLONE_TOKEN}@github.com/${NEXT_REPO_SLUG}.git" _cloud_run_app
          elif git clone --depth 1 "https://github.com/${NEXT_REPO_SLUG}.git" _cloud_run_app 2>/tmp/gh-clone.log; then
            echo "Cloned without PAT (repository is public)."
          else
            cat /tmp/gh-clone.log >&2 || true
            echo "::error::Clone failed — https://github.com/${NEXT_REPO_SLUG} is private, the slug is wrong, or GitHub blocked the request."
            echo "::error::For a private app repository, add Actions **secret** CLOUD_RUN_APP_CHECKOUT_TOKEN (fine-grained PAT: Contents **Read** on that repo)."
            exit 1
          fi

      - name: Resolve Next.js app directory
        id: app
        run: |
          set -euo pipefail
          found() { [ -f "$1/package.json" ] && [ -f "$1/package-lock.json" ]; }

          APP_ROOT="${{ steps.detect.outputs.app_root }}"
          if [ -n "$APP_ROOT" ]; then
            if ! found "$APP_ROOT"; then
              echo "::error::Expected package.json + package-lock.json in $APP_ROOT"
              exit 1
            fi
            abs="$(cd "$APP_ROOT" && pwd)"
            rel="$(realpath --relative-to="${GITHUB_WORKSPACE}" "$abs")"
            echo "Using app root: $rel"
            echo "root=$rel" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="_cloud_run_app"
          candidates=()
          if [ -n "${CLOUD_RUN_APP_PATH:-}" ]; then candidates+=("$base/${CLOUD_RUN_APP_PATH}"); fi
          candidates+=("$base" "$base/frontend")

          for r in "${candidates[@]}"; do
            if found "$r"; then
              abs="$(cd "$r" && pwd)"
              rel="$(realpath --relative-to="${GITHUB_WORKSPACE}" "$abs")"
              echo "Using app root: $rel (from cloned repo, candidate $r)"
              echo "root=$rel" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::No package.json + package-lock.json after clone. Set variable CLOUD_RUN_APP_REPOSITORY to your Next repo and optional CLOUD_RUN_APP_PATH."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package-lock.json', steps.app.outputs.root)) }}

      - name: Install and build
        working-directory: ${{ steps.app.outputs.root }}
        run: |
          npm ci
          DATABASE_URL="mongodb://127.0.0.1:27017/dummy" npx prisma generate
          npx tsc --noEmit
          npm run build

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect Next.js app in this repository
        id: detect
        run: |
          set -euo pipefail
          has() { [ -f "$1/package.json" ] && [ -f "$1/package-lock.json" ]; }
          if has "."; then
            echo "app_root=." >> "$GITHUB_OUTPUT"
          elif has "frontend"; then
            echo "app_root=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "app_root=" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone Next app (when workflow repo is not the app)
        if: ${{ steps.detect.outputs.app_root == '' }}
        env:
          NEXT_REPO_SLUG: ${{ vars.CLOUD_RUN_APP_REPOSITORY || 'jatinder14/hiring-platform' }}
          CLONE_TOKEN: ${{ secrets.CLOUD_RUN_APP_CHECKOUT_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          rm -rf _cloud_run_app
          echo "Cloning https://github.com/${NEXT_REPO_SLUG}.git (depth 1) into _cloud_run_app"
          if [ -n "${CLONE_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${CLONE_TOKEN}@github.com/${NEXT_REPO_SLUG}.git" _cloud_run_app
          elif git clone --depth 1 "https://github.com/${NEXT_REPO_SLUG}.git" _cloud_run_app 2>/tmp/gh-clone.log; then
            echo "Cloned without PAT (repository is public)."
          else
            cat /tmp/gh-clone.log >&2 || true
            echo "::error::Clone failed — https://github.com/${NEXT_REPO_SLUG} is private, the slug is wrong, or GitHub blocked the request."
            echo "::error::For a private app repository, add Actions **secret** CLOUD_RUN_APP_CHECKOUT_TOKEN (fine-grained PAT: Contents **Read** on that repo)."
            exit 1
          fi

      - name: Resolve Next.js app directory
        id: app
        run: |
          set -euo pipefail
          found() { [ -f "$1/package.json" ] && [ -f "$1/package-lock.json" ]; }

          APP_ROOT="${{ steps.detect.outputs.app_root }}"
          if [ -n "$APP_ROOT" ]; then
            if ! found "$APP_ROOT"; then
              echo "::error::Expected package.json + package-lock.json in $APP_ROOT"
              exit 1
            fi
            abs="$(cd "$APP_ROOT" && pwd)"
            rel="$(realpath --relative-to="${GITHUB_WORKSPACE}" "$abs")"
            echo "Using app root: $rel"
            echo "root=$rel" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="_cloud_run_app"
          candidates=()
          if [ -n "${CLOUD_RUN_APP_PATH:-}" ]; then candidates+=("$base/${CLOUD_RUN_APP_PATH}"); fi
          candidates+=("$base" "$base/frontend")

          for r in "${candidates[@]}"; do
            if found "$r"; then
              abs="$(cd "$r" && pwd)"
              rel="$(realpath --relative-to="${GITHUB_WORKSPACE}" "$abs")"
              echo "Using app root: $rel (from cloned repo, candidate $r)"
              echo "root=$rel" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::No package.json + package-lock.json after clone for deploy."
          exit 1

      - name: Require Dockerfile in app root
        working-directory: ${{ steps.app.outputs.root }}
        run: test -f Dockerfile || { echo "::error::No Dockerfile in app root ($PWD)."; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Enable required APIs (idempotent)
        run: |
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com \
            --project="${PROJECT_ID}" --quiet

      - name: Ensure Artifact Registry repository
        run: |
          if gcloud artifacts repositories describe "${AR_REPOSITORY}" \
            --location="${REGION}" --project="${PROJECT_ID}" --quiet 2>/dev/null; then
            echo "Repository ${AR_REPOSITORY} already exists."
          else
            gcloud artifacts repositories create "${AR_REPOSITORY}" \
              --repository-format=docker \
              --location="${REGION}" \
              --project="${PROJECT_ID}" \
              --description="Cloud Run container images"
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        working-directory: ${{ steps.app.outputs.root }}
        run: |
          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE}"
          docker build \
            -t "${IMAGE_BASE}:${GITHUB_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:latest"

      - name: Sync dotenv to Secret Manager (hookstep-dotenv)
        env:
          DOTENV_B64: ${{ secrets.DOTENV_PRODUCTION_B64 }}
          APP_ROOT: ${{ steps.app.outputs.root }}
        run: |
          set -euo pipefail
          if [ -n "${DOTENV_B64:-}" ]; then
            echo "$DOTENV_B64" | base64 -d > .env.ci.raw
            awk '/^[[:space:]]*$/ { print; next} /^[[:space:]]*#/ { print; next} /^[[:space:]]*PORT=/ { next} /^[[:space:]]*HOSTNAME=/ { next} /^[[:space:]]*HOST=/ { next} { print}' .env.ci.raw > .env.ci.sync
            rm -f .env.ci.raw
            if ! gcloud secrets describe hookstep-dotenv --project="${PROJECT_ID}" &>/dev/null; then
              gcloud secrets create hookstep-dotenv --replication-policy=automatic --project="${PROJECT_ID}" --quiet
            fi
            gcloud secrets versions add hookstep-dotenv --data-file=.env.ci.sync --project="${PROJECT_ID}" --quiet
            rm -f .env.ci.sync
            bash "${APP_ROOT}/scripts/disable-old-secret-manager-versions.sh" hookstep-dotenv "${PROJECT_ID}"
            echo "Added new Secret Manager version for hookstep-dotenv (older enabled versions disabled)."
          else
            echo "::notice::DOTENV_PRODUCTION_B64 not set — not uploading a new secret version this run."
          fi

      - name: Ensure hookstep-dotenv has a version and grant runtime access
        run: |
          set -euo pipefail
          gcloud secrets describe hookstep-dotenv --project="${PROJECT_ID}" --quiet
          if ! gcloud secrets versions list hookstep-dotenv --project="${PROJECT_ID}" --limit=1 --format='value(name)' | grep -q .; then
            echo "::error::Secret hookstep-dotenv has no versions. Set GitHub secret DOTENV_PRODUCTION_B64 or run: ./scripts/sync-dotenv-to-secret-manager.sh"
            exit 1
          fi
          gcloud secrets add-iam-policy-binding hookstep-dotenv \
            --member="serviceAccount:${GCP_PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" \
            --project="${PROJECT_ID}" --quiet || true

      - name: Deploy Cloud Run service
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --project="${PROJECT_ID}" \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --allow-unauthenticated \
            --clear-env-vars \
            --set-secrets="/secrets/.env=hookstep-dotenv:latest" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" \
            --format='value(status.url)'
